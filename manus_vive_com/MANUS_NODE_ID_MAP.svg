<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #182230; }
      .subtitle { font: 21px 'Segoe UI', Arial, sans-serif; fill: #52606d; }
      .group { font: 700 24px 'Segoe UI', Arial, sans-serif; }
      .row { font: 19px 'Segoe UI', Arial, sans-serif; fill: #263442; }
      .note { font: 18px 'Segoe UI', Arial, sans-serif; fill: #52606d; }
      .node { stroke: white; stroke-width: 3; }
      .id { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: central; }
      .bone { fill: none; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; opacity: .58; }
      .thin { fill: none; stroke: #9aa8b5; stroke-width: 3; stroke-linecap: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1800" height="1250" fill="#f7f9fc"/>
  <text x="70" y="65" class="title">MANUS RawSkeleton node_id Map</text>
  <text x="70" y="100" class="subtitle">25 nodes per hand · same IDs for left and right hands (mirror the drawing)</text>

  <rect x="45" y="135" width="865" height="1035" rx="28" fill="white" filter="url(#shadow)"/>
  <!-- simplified hand silhouette -->
  <path d="M330 1005 C285 940 278 825 305 745 L330 675 L305 565 C295 525 320 490 353 500
           L382 610 L380 300 C380 253 415 232 448 254 L465 535 L478 175 C482 126 528 113 557 149
           L565 526 L590 255 C596 211 640 201 668 235 L655 560 L705 385 C718 341 760 337 785 369
           L760 650 C750 720 780 775 795 845 C812 925 760 1030 675 1085 C565 1155 402 1110 330 1005 Z"
        fill="#f2d4bd" stroke="#d5a98c" stroke-width="5"/>

  <!-- hierarchy bones -->
  <path class="bone" stroke="#7c8794" d="M470 1010 L410 860"/>
  <path class="bone" stroke="#7c8794" d="M470 1010 L465 850 M470 1010 L545 850 M470 1010 L625 865 M470 1010 L700 900"/>
  <path class="bone" stroke="#8e63ce" d="M410 860 L310 800 L220 720 L145 635"/>
  <path class="bone" stroke="#2f80ed" d="M465 850 L445 675 L430 500 L420 340 L415 215"/>
  <path class="bone" stroke="#20a464" d="M545 850 L545 650 L545 455 L545 265 L545 155"/>
  <path class="bone" stroke="#e09b20" d="M625 865 L650 690 L675 520 L700 365 L720 235"/>
  <path class="bone" stroke="#df5d77" d="M700 900 L750 760 L800 635 L845 525 L875 435"/>

  <!-- nodes: hand -->
  <g fill="#5b6573"><circle class="node" cx="470" cy="1010" r="22"/><text class="id" x="470" y="1010">0</text></g>
  <text x="505" y="1047" class="row">Hand Root / Wrist</text>

  <!-- thumb 1-4 -->
  <g fill="#8e63ce">
    <circle class="node" cx="410" cy="860" r="22"/><text class="id" x="410" y="860">1</text>
    <circle class="node" cx="310" cy="800" r="22"/><text class="id" x="310" y="800">2</text>
    <circle class="node" cx="220" cy="720" r="22"/><text class="id" x="220" y="720">3</text>
    <circle class="node" cx="145" cy="635" r="22"/><text class="id" x="145" y="635">4</text>
  </g>
  <!-- index 5-9 -->
  <g fill="#2f80ed">
    <circle class="node" cx="465" cy="850" r="22"/><text class="id" x="465" y="850">5</text>
    <circle class="node" cx="445" cy="675" r="22"/><text class="id" x="445" y="675">6</text>
    <circle class="node" cx="430" cy="500" r="22"/><text class="id" x="430" y="500">7</text>
    <circle class="node" cx="420" cy="340" r="22"/><text class="id" x="420" y="340">8</text>
    <circle class="node" cx="415" cy="215" r="22"/><text class="id" x="415" y="215">9</text>
  </g>
  <!-- middle 10-14 -->
  <g fill="#20a464">
    <circle class="node" cx="545" cy="850" r="22"/><text class="id" x="545" y="850">10</text>
    <circle class="node" cx="545" cy="650" r="22"/><text class="id" x="545" y="650">11</text>
    <circle class="node" cx="545" cy="455" r="22"/><text class="id" x="545" y="455">12</text>
    <circle class="node" cx="545" cy="265" r="22"/><text class="id" x="545" y="265">13</text>
    <circle class="node" cx="545" cy="155" r="22"/><text class="id" x="545" y="155">14</text>
  </g>
  <!-- ring 15-19 -->
  <g fill="#e09b20">
    <circle class="node" cx="625" cy="865" r="22"/><text class="id" x="625" y="865">15</text>
    <circle class="node" cx="650" cy="690" r="22"/><text class="id" x="650" y="690">16</text>
    <circle class="node" cx="675" cy="520" r="22"/><text class="id" x="675" y="520">17</text>
    <circle class="node" cx="700" cy="365" r="22"/><text class="id" x="700" y="365">18</text>
    <circle class="node" cx="720" cy="235" r="22"/><text class="id" x="720" y="235">19</text>
  </g>
  <!-- pinky 20-24 -->
  <g fill="#df5d77">
    <circle class="node" cx="700" cy="900" r="22"/><text class="id" x="700" y="900">20</text>
    <circle class="node" cx="750" cy="760" r="22"/><text class="id" x="750" y="760">21</text>
    <circle class="node" cx="800" cy="635" r="22"/><text class="id" x="800" y="635">22</text>
    <circle class="node" cx="845" cy="525" r="22"/><text class="id" x="845" y="525">23</text>
    <circle class="node" cx="875" cy="435" r="22"/><text class="id" x="875" y="435">24</text>
  </g>

  <!-- legend -->
  <rect x="940" y="135" width="815" height="1035" rx="28" fill="white" filter="url(#shadow)"/>
  <text x="980" y="185" class="group" fill="#263442">ID → official MANUS joint type → common abbreviation</text>

  <text x="980" y="235" class="group" fill="#5b6573">HAND</text>
  <text x="1000" y="270" class="row">00  Hand Root / Wrist  (WRIST)</text>

  <text x="980" y="320" class="group" fill="#8e63ce">THUMB (T)</text>
  <text x="1000" y="355" class="row">01  Thumb Metacarpal  (T-MC)</text>
  <text x="1000" y="390" class="row">02  Thumb Proximal / MCP  (T-MCP)</text>
  <text x="1000" y="425" class="row">03  Thumb Distal / IP  (T-IP)</text>
  <text x="1000" y="460" class="row">04  Thumb Tip  (T-TIP)</text>

  <text x="980" y="510" class="group" fill="#2f80ed">INDEX (I)</text>
  <text x="1000" y="545" class="row">05  Index Metacarpal  (I-MC)</text>
  <text x="1000" y="580" class="row">06  Index Proximal / MCP  (I-MCP)</text>
  <text x="1000" y="615" class="row">07  Index Intermediate / PIP  (I-PIP)</text>
  <text x="1000" y="650" class="row">08  Index Distal / DIP  (I-DIP)</text>
  <text x="1000" y="685" class="row">09  Index Tip  (I-TIP)</text>

  <text x="980" y="735" class="group" fill="#20a464">MIDDLE (M)</text>
  <text x="1000" y="770" class="row">10  Middle Metacarpal  (M-MC)</text>
  <text x="1000" y="805" class="row">11  Middle Proximal / MCP  (M-MCP)</text>
  <text x="1000" y="840" class="row">12  Middle Intermediate / PIP  (M-PIP)</text>
  <text x="1000" y="875" class="row">13  Middle Distal / DIP  (M-DIP)</text>
  <text x="1000" y="910" class="row">14  Middle Tip  (M-TIP)</text>

  <text x="1340" y="235" class="group" fill="#e09b20">RING (R)</text>
  <text x="1360" y="270" class="row">15  Ring Metacarpal  (R-MC)</text>
  <text x="1360" y="305" class="row">16  Ring Proximal / MCP  (R-MCP)</text>
  <text x="1360" y="340" class="row">17  Ring Intermediate / PIP  (R-PIP)</text>
  <text x="1360" y="375" class="row">18  Ring Distal / DIP  (R-DIP)</text>
  <text x="1360" y="410" class="row">19  Ring Tip  (R-TIP)</text>

  <text x="1340" y="470" class="group" fill="#df5d77">PINKY (P)</text>
  <text x="1360" y="505" class="row">20  Pinky Metacarpal  (P-MC)</text>
  <text x="1360" y="540" class="row">21  Pinky Proximal / MCP  (P-MCP)</text>
  <text x="1360" y="575" class="row">22  Pinky Intermediate / PIP  (P-PIP)</text>
  <text x="1360" y="610" class="row">23  Pinky Distal / DIP  (P-DIP)</text>
  <text x="1360" y="645" class="row">24  Pinky Tip  (P-TIP)</text>

  <line x1="975" y1="955" x2="1715" y2="955" stroke="#d7dee6" stroke-width="2"/>
  <text x="980" y="995" class="group" fill="#263442">Hierarchy</text>
  <text x="1000" y="1032" class="note">0 → each finger metacarpal → proximal → intermediate → distal → tip</text>
  <text x="1000" y="1066" class="note">Thumb has no Intermediate node: 0 → 1 → 2 → 3 → 4</text>
  <text x="1000" y="1100" class="note">Left hand uses the identical IDs; mirror the hand drawing horizontally.</text>
  <text x="1000" y="1134" class="note">MC/MCP/PIP/DIP/IP are common anatomical shorthand.</text>
</svg>
