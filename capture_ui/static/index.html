<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联合数据采集</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>联合数据采集</h1>
      </div>
      <div id="clock" class="clock">--:--:--</div>
    </header>

    <section class="control-card">
      <div class="overall-status">
        <span id="phase-dot" class="status-dot idle"></span>
        <div>
          <div id="phase-label" class="phase-label">准备就绪</div>
          <div id="phase-message" class="phase-message">正在读取系统状态…</div>
        </div>
      </div>
      <div class="actions">
        <button id="bind-button" class="button secondary">绑定 Tracker 角色</button>
        <button id="ble-button" class="button secondary">启动常驻授时</button>
        <label class="rate-field">
          <span>Tracker 采样率</span>
          <span class="input-wrap"><input id="tracker-rate" type="number" min="1" max="1000" step="1" value="120"><b>Hz</b></span>
        </label>
        <button id="start-button" class="button primary" disabled>开始录制</button>
        <button id="stop-button" class="button danger" disabled>停止录制</button>
      </div>
      <div class="mode2-bar">
        <div class="coordinator-identity">
          <span class="mode2-title">Mode2 中控</span>
          <strong id="coordinator-name">Mode2Coordinator · 未连接</strong>
        </div>
        <div class="mode2-summary">
          <span id="timesync-chip" class="mode2-chip unknown">授时 STOPPED</span>
          <span id="control-chip" class="mode2-chip unknown">控制 OFFLINE</span>
          <span id="utc-chip" class="mode2-chip unknown">UTC UNKNOWN</span>
        </div>
        <div id="node-list" class="node-list">
          <span class="node-empty">尚未收到 wearable 节点状态</span>
        </div>
      </div>
      <div id="notice" class="notice" hidden></div>
    </section>

    <section class="terminal-grid">
      <article class="terminal-card">
        <header class="terminal-header">
          <div>
            <h2>Mode2 授时与串口</h2>
            <p>TIME_QUERY / TIME_SET、RTT、UTC 映射与重试情况</p>
          </div>
          <span id="ble-status" class="pill stopped">未运行</span>
        </header>
        <div id="ble-timesync-log" class="terminal" role="log" aria-live="polite"></div>
      </article>

      <article class="terminal-card control-terminal-card">
        <header class="terminal-header">
          <div>
            <h2>Mode2 录制控制</h2>
            <p>键盘 1 / 0、START / STOP 及 wearable 确认结果</p>
          </div>
          <span id="control-result" class="pill control-result standby">待机</span>
        </header>
        <div id="ble-control-log" class="terminal" role="log" aria-live="polite"></div>
      </article>

      <article class="terminal-card">
        <header class="terminal-header">
          <div>
            <h2>VIVE Tracker</h2>
            <p>OpenXR 位姿采集与落盘状态</p>
          </div>
          <span id="vive-status" class="pill stopped">未运行</span>
        </header>
        <div id="vive-log" class="terminal" role="log" aria-live="polite"></div>
      </article>
    </section>

    <footer>
      <span id="output-path">VIVE 输出目录：尚未开始</span>
      <button id="clear-button" class="text-button">清空屏幕日志</button>
    </footer>
  </main>
  <script src="/app.js?v=20260808-mode2"></script>
</body>
</html>
